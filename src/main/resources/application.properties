spring.application.name=fleurs

# Connexion à MongoDB (en local ou via docker compose)
# Spring Boot 4 lit "spring.mongodb.uri" ; on garde aussi l'ancien nom au cas où
spring.mongodb.uri=${MONGODB_URI:mongodb://admin:example@localhost:27017/fleurs?authSource=admin}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:example@localhost:27017/fleurs?authSource=admin}

# Pour que les index (@Indexed) soient créés automatiquement
spring.data.mongodb.auto-index-creation=true
